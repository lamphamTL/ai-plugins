name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      branch:
        description: 'Target branch for the bump PR'
        required: false
        default: 'develop'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new version
        id: ver
        run: |
          NEW=$(.github/workflows/scripts/compute-version.sh "${{ inputs.bump }}")
          CURRENT=$(tr -d '[:space:]' < VERSION)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "branch=bump-version/v$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW"

      - name: Apply new version
        run: .github/workflows/scripts/apply-version.sh "${{ steps.ver.outputs.new }}"

      - name: Commit and push branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.ver.outputs.branch }}"
          git add VERSION \
            plugin/.claude-plugin/plugin.json \
            plugin/.codex-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "No file changes detected; aborting." >&2
            exit 1
          fi
          git commit -m "Bump version v${{ steps.ver.outputs.new }}"
          git push --force-with-lease origin "${{ steps.ver.outputs.branch }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Bump version v${{ steps.ver.outputs.new }}"
          BODY="Automated version bump: \`${{ steps.ver.outputs.current }}\` → \`${{ steps.ver.outputs.new }}\` (${{ inputs.bump }})."
          if gh pr view "${{ steps.ver.outputs.branch }}" --json number >/dev/null 2>&1; then
            gh pr edit "${{ steps.ver.outputs.branch }}" --title "$TITLE" --body "$BODY" --base "${{ inputs.branch }}"
          else
            gh pr create \
              --base "${{ inputs.branch }}" \
              --head "${{ steps.ver.outputs.branch }}" \
              --title "$TITLE" \
              --body "$BODY"
          fi
