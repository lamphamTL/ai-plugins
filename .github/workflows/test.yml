name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python unit tests
        working-directory: plugin/hooks
        run: python -m unittest discover -s tests -v

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift unit tests
        working-directory: token-usage-app
        run: swift test
